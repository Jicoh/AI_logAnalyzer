<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Log Analyzer{% endblock %}</title>
    <link href="{{ url_for('static', filename='css/vendor/bootstrap.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/bootstrap-icons.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    {% block extra_head %}{% endblock %}
</head>
<body x-data="sidebarApp()" x-init="init()">
    <div class="d-flex" style="height: 100vh;">
        <!-- Sidebar -->
        <div class="sidebar bg-dark text-white d-flex flex-column">
            <div class="sidebar-header">
                <span>AI Log Analyzer</span>
                <i class="bi bi-chevron-left sidebar-toggle ms-auto" onclick="toggleSidebar()"></i>
            </div>
            <nav class="sidebar-nav flex-grow-1">
                <a href="{{ url_for('main.assistant') }}" class="nav-link {% if active_page == 'assistant' %}active{% endif %}">
                    <i class="bi bi-chat-dots"></i> <span>智能助手</span>
                </a>
                <a href="{{ url_for('main.index') }}" class="nav-link {% if active_page == 'analyzer' %}active{% endif %}">
                    <i class="bi bi-search"></i> <span>日志分析</span>
                </a>
                <a href="{{ url_for('main.log_viewer') }}" class="nav-link {% if active_page == 'log_viewer' %}active{% endif %}">
                    <i class="bi bi-file-text"></i> <span>日志查看</span>
                </a>
                <a href="{{ url_for('main.history') }}" class="nav-link {% if active_page == 'history' %}active{% endif %}">
                    <i class="bi bi-clock-history"></i> <span>历史记录</span>
                </a>
            </nav>
            <nav class="sidebar-nav border-top border-secondary">
                <template x-if="userInfo.is_admin">
                    <a href="{{ url_for('main.admin_dashboard') }}" class="nav-link {% if active_page == 'admin' %}active{% endif %}">
                        <i class="bi bi-shield-lock"></i> <span>管理员</span>
                    </a>
                </template>
                <a href="{{ url_for('main.profile') }}" class="nav-link {% if active_page == 'profile' %}active{% endif %}">
                    <i class="bi bi-person"></i> <span>个人中心</span>
                </a>
                <a href="{{ url_for('main.settings') }}" class="nav-link {% if active_page == 'settings' %}active{% endif %}">
                    <i class="bi bi-gear"></i> <span>设置</span>
                </a>
            </nav>
            <!-- 资源使用情况 -->
            <div class="sidebar-usage border-top border-secondary">
                <div class="sidebar-usage-expanded p-3">
                    <div class="usage-item">
                        <small class="text-white-50 d-block mb-1"><i class="bi bi-hard-drive"></i> 存储空间</small>
                        <small class="text-white-50 d-block mb-1" x-text="quotaStatus.used_formatted + '/' + quotaStatus.quota_formatted + ' (' + (quotaStatus.percent || 0) + '%)'"></small>
                        <div class="progress" style="height: 6px;">
                            <div class="progress-bar"
                                 :class="(quotaStatus.percent || 0) > 80 ? 'bg-danger' : (quotaStatus.percent || 0) > 60 ? 'bg-warning' : 'bg-success'"
                                 :style="'width: ' + (quotaStatus.percent || 0) + '%'"></div>
                        </div>
                    </div>
                </div>
                <div class="sidebar-usage-collapsed p-2 text-center">
                    <small class="text-white-50" x-text="(quotaStatus.percent || 0) + '%'"></small>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content flex-grow-1">
            {% block content %}{% endblock %}
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/htmx.min.js') }}"></script>
    <script defer src="{{ url_for('static', filename='js/alpine.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script>
    function sidebarApp() {
        return {
            userInfo: {},
            quotaStatus: {},
            init() {
                this.loadUserInfo();
                this.loadQuota();
                // 定期刷新存储空间（每60秒）
                setInterval(() => this.loadQuota(), 60000);
            },
            loadUserInfo() {
                fetch('/api/auth/me').then(r => r.json()).then(d => {
                    if(d.success) {
                        this.userInfo = d.data;
                    } else {
                        window.location.href = '/login';
                    }
                });
            },
            loadQuota() {
                fetch('/api/cache/stats').then(r => r.json()).then(d => {
                    if(d.success) {
                        this.quotaStatus = d.data.quota || {};
                    }
                }).catch(e => console.error('Failed to load quota:', e));
            }
        };
    }
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
